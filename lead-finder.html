<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Finder</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dce3;--go:#0b7a4b;--bad:#b3341e;--badbg:#fbe9e5}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3946;--go:#3ec98a;--bad:#ff8a73;--badbg:#3a1f1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font-size:1.6rem;margin:8px 0 2px;letter-spacing:-.02em}
p.sub{margin:0 0 16px;color:var(--mute)}
details,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:150px;resize:vertical}
button,a.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--go);color:#fff;text-decoration:none;cursor:pointer;display:inline-block}
button.alt,a.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:6px;padding:2px 8px;font-size:.82rem;margin:2px 4px 2px 0}
.meta{color:var(--mute);font-size:.88rem}
.name{font-weight:700;font-size:1.05rem}
.done{opacity:.55}
#msg{color:var(--bad);min-height:1.4em;margin:6px 0}
</style>
</head>
<body>
<h1>Lead Finder</h1>
<p class="sub">Find businesses, spot their problem, draft the pitch, send it yourself.</p>

<details id="setup">
<summary>Setup (keys and your offer)</summary>
<label for="maps">Google Maps API key (Places API New enabled)</label>
<input id="maps" type="password" autocomplete="off">
<label for="groq">Groq API key</label>
<input id="groq" type="password" autocomplete="off">
<label for="me">Your name and business</label>
<input id="me" placeholder="Stephen from Mwangolo Web Studio">
<label for="svc">What you sell, in one line</label>
<input id="svc" placeholder="Websites, booking pages and M-Pesa payments for small businesses">
<div class="row"><button id="save">Save</button></div>
</details>

<div class="card">
<div class="two">
<div><label for="ind">Industry</label><input id="ind" placeholder="salons"></div>
<div><label for="area">Area</label><input id="area" placeholder="Westlands, Nairobi"></div>
</div>
<div class="row"><button id="go">Find leads</button><button id="clr" class="alt">Clear list</button></div>
<div id="msg" role="status"></div>
</div>

<div id="list"></div>

<script>
const $=id=>document.getElementById(id);
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg=L('lf_cfg',{}), leads=L('lf_leads',[]);
['maps','groq','me','svc'].forEach(k=>$(k).value=cfg[k]||'');
if(!cfg.maps||!cfg.groq)$('setup').open=true;
$('save').onclick=()=>{['maps','groq','me','svc'].forEach(k=>cfg[k]=$(k).value.trim());S('lf_cfg',cfg);say('Saved.');$('setup').open=false};
$('clr').onclick=()=>{leads=[];S('lf_leads',leads);render()};
function say(t){$('msg').textContent=t}

// Problem detection: each rule = a visible weakness plus the offer that fixes it
function detect(p){
 const out=[],w=p.websiteUri||'',r=p.rating,n=p.userRatingCount||0;
 if(!w)out.push({t:'No website',o:'a simple website with a WhatsApp button and M-Pesa payment',w:5});
 else if(/facebook\.com|instagram\.com|linktr\.ee|wa\.me|business\.site/i.test(w))out.push({t:'Only a social page or free site',o:'a proper website they own, so customers can find and book them on Google',w:4});
 else if(w.startsWith('http:'))out.push({t:'Website is not secure (no HTTPS)',o:'a secure, faster website (browsers warn visitors away from insecure sites)',w:3});
 if(r&&r<4)out.push({t:'Rating '+r+' on Google',o:'a review-reply and feedback follow-up system to lift their rating',w:3});
 if(n<15)out.push({t:'Only '+n+' Google reviews',o:'an automatic WhatsApp review-request after each customer visit',w:2});
 if(!p.internationalPhoneNumber)out.push({t:'No phone number listed',o:'a contact and booking page so customers can reach them',w:2});
 return out;
}
const score=l=>l.problems.reduce((a,x)=>a+x.w,0);

$('go').onclick=async()=>{
 if(!cfg.maps)return say('Add your Google Maps key in Setup.');
 const ind=$('ind').value.trim(),area=$('area').value.trim();
 if(!ind||!area)return say('Enter an industry and an area.');
 say('Searching...');$('go').disabled=true;
 try{
  const res=await fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',
   headers:{'Content-Type':'application/json','X-Goog-Api-Key':cfg.maps,
   'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.websiteUri,places.internationalPhoneNumber,places.rating,places.userRatingCount,places.googleMapsUri,places.businessStatus'},
   body:JSON.stringify({textQuery:ind+' in '+area,pageSize:20})});
  const d=await res.json();
  if(!res.ok)throw new Error(d.error?.message||'Search failed');
  const seen=new Set(leads.map(l=>l.id));
  const fresh=(d.places||[]).filter(p=>p.businessStatus!=='CLOSED_PERMANENTLY'&&!seen.has(p.id)).map(p=>({
   id:p.id,name:p.displayName?.text||'Unnamed',addr:p.formattedAddress||'',phone:p.internationalPhoneNumber||'',
   site:p.websiteUri||'',rating:p.rating,count:p.userRatingCount||0,map:p.googleMapsUri,industry:ind,problems:detect(p),draft:'',status:''}));
  leads=[...fresh,...leads].sort((a,b)=>score(b)-score(a));S('lf_leads',leads);render();
  say(fresh.length+' new leads, best problems first.');
 }catch(e){say(e.message)}
 $('go').disabled=false;
};

async function draft(i){
 const l=leads[i];
 if(!cfg.groq)return say('Add your Groq key in Setup.');
 if(!l.problems.length)return say('No clear problem found for this lead. Skip it or write manually.');
 const top=l.problems[0];
 say('Drafting for '+l.name+'...');
 try{
  const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.groq},
   body:JSON.stringify({model:'llama-3.3-70b-versatile',temperature:0.6,max_tokens:220,messages:[
    {role:'system',content:'You write short WhatsApp messages from a freelancer to a small business owner in Kenya. Friendly, plain English, under 70 words. Mention exactly ONE observed problem and ONE offer, then ask one easy question. Do not invent facts, prices or results. Do not flatter. End with: "Reply STOP and I won\'t message again." Output only the message.'},
    {role:'user',content:`Sender: ${cfg.me||'a local web freelancer'}. Sells: ${cfg.svc||'websites and business tools'}.
Business: ${l.name} (${l.industry}), ${l.addr}.
Observed problem: ${top.t}.
Offer: ${top.o}.`}]})});
  const d=await res.json();
  if(!res.ok)throw new Error(d.error?.message||'Groq failed');
  l.draft=d.choices[0].message.content.trim();S('lf_leads',leads);render();say('Draft ready. Edit it, then send.');
 }catch(e){say(e.message)}
}

function wa(l){
 let n=(l.phone||'').replace(/\D/g,'');
 if(n.startsWith('0'))n='254'+n.slice(1);
 return n?'https://wa.me/'+n+'?text='+encodeURIComponent(l.draft):'';
}

function render(){
 $('list').innerHTML=leads.map((l,i)=>`<div class="card ${l.status?'done':''}" data-i="${i}">
 <div class="name">${esc(l.name)}</div>
 <div class="meta">${esc(l.addr)}${l.phone?'<br>'+esc(l.phone):''}<br>${l.rating?'★ '+l.rating+' ('+l.count+')':'No rating'}${l.site?' · <a href="'+esc(l.site)+'" target="_blank" rel="noopener">site</a>':''} · <a href="${esc(l.map)}" target="_blank" rel="noopener">map</a></div>
 <div>${l.problems.length?l.problems.map(p=>'<span class="chip">'+esc(p.t)+'</span>').join(''):'<span class="meta">No clear problem found</span>'}</div>
 ${l.status?'<div class="meta">Marked '+esc(l.status)+'</div>':''}
 ${l.draft?`<label for="d${i}">Pitch (edit before sending)</label><textarea id="d${i}" data-d="${i}">${esc(l.draft)}</textarea>`:''}
 <div class="row">
  <button data-a="draft">${l.draft?'Redraft':'Draft pitch'}</button>
  ${l.draft&&wa(l)?`<a class="btn alt" data-a="wa" href="${wa(l)}" target="_blank" rel="noopener">Open WhatsApp</a>`:''}
  ${l.draft?'<button class="alt" data-a="copy">Copy</button>':''}
  <button class="alt" data-a="done">${l.status?'Undo':'Mark contacted'}</button>
 </div></div>`).join('')||'<p class="meta">No leads yet. Search above.</p>';
}
$('list').addEventListener('input',e=>{const i=e.target.dataset.d;if(i!==undefined){leads[i].draft=e.target.value;S('lf_leads',leads)}});
$('list').addEventListener('click',e=>{
 const a=e.target.dataset.a,c=e.target.closest('.card');if(!a||!c)return;
 const i=+c.dataset.i;
 if(a==='draft')draft(i);
 if(a==='copy'){navigator.clipboard?.writeText(leads[i].draft);say('Copied.')}
 if(a==='done'){leads[i].status=leads[i].status?'':'contacted';S('lf_leads',leads);render()}
 if(a==='wa'){leads[i].status=leads[i].status||'contacted';S('lf_leads',leads);setTimeout(render,300)}
});
render();
</script>
</body>
</html>
